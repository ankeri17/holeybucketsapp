# CI: every pull request (and every push to the working or release branch)
# must typecheck, lint, pass the tests, and build before it can be trusted.
# Netlify deploys from `main`; day-to-day work merges into the default
# branch and is released by PRing it into `main`. This just stops broken
# code from reaching either.
name: CI

on:
  push:
    branches: [main, claude/holey-buckets-app-review-gcuzef]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
